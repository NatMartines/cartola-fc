version: 2

models:
  - name: stg_atletas_rodada
    description: >
      Uma linha por atleta por arquivo de rodada (temporadas 2022 a 2026), com os campos do JSON tipados.
      O arquivo rodada-N é a foto do mercado depois da rodada N: pontos é a pontuação da rodada N,
      enquanto jogos, média e scouts são acumulados na temporada.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [temporada, rodada, atleta_id]
    columns:
      - name: temporada
        description: Ano da temporada, lido do caminho do arquivo.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2022
                max_value: 2026
      - name: rodada
        description: Número da rodada, lido do nome do arquivo (rodada-N).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 38
      - name: atleta_id
        description: Id do atleta no Cartola (estável entre temporadas).
        data_tests: [not_null]
      - name: apelido
        description: Nome pelo qual o atleta aparece no jogo.
      - name: clube_id
        description: >
          Id do clube. Dois técnicos na rodada 18 de 2023 vieram com clube_id 1 (sem clube), por isso o
          relacionamento com o seed é warn.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('clubes')
                field: clube_id
              config:
                severity: warn
      - name: posicao_id
        description: 1 goleiro, 2 lateral, 3 zagueiro, 4 meia, 5 atacante, 6 técnico (texto de 2022 já convertido).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6]
                quote: false
      - name: status_id
        description: 2 dúvida, 3 suspenso, 5 contundido, 6 nulo, 7 provável.
        data_tests:
          - accepted_values:
              arguments:
                values: [2, 3, 5, 6, 7]
                quote: false
      - name: rodada_informada
        description: >
          Rodada que o próprio arquivo informa (atletas.rodada_id). Em 2023 o arquivo rodada-1 traz 2 e
          pontos zerados: é uma foto tirada antes da rodada 2, não o resultado da rodada 1.
      - name: pontos
        description: Pontuação do atleta na rodada do arquivo.
        data_tests: [not_null]
      - name: preco
        description: Preço em cartoletas (C$) depois da rodada.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: variacao
        description: Quanto o preço mudou nesta rodada, em C$.
      - name: media_oficial
        description: Média de pontos acumulada na temporada, calculada pelo Cartola.
      - name: jogos_oficial
        description: Jogos acumulados na temporada, contados pelo Cartola.
        data_tests: [not_null]
      - name: entrou_em_campo_fonte
        description: Flag da fonte; não existe em 2022 e falta em parte de 2023.
      - name: arquivo_origem
        description: Caminho do arquivo no stage.
        data_tests: [not_null]

  - name: stg_escudos
    description: Um escudo por clube, em data URI (data:image/png;base64,...), pronto para o dashboard.
    columns:
      - name: clube_id
        description: Id do clube no Cartola.
        data_tests: [unique, not_null]
